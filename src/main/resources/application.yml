spring:
  application:
    name: kairos
  config:
    import: optional:file:.env[.properties]
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5433}/${POSTGRES_DB:kairos_db}}
    username: ${POSTGRES_USER:kairos_user}
    password: ${POSTGRES_PASSWORD:kairos_password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    postgresql:
      transactional:
        lock: false

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

kairos:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${ACCESS}
    refresh-expiration: ${REFRESH}
  sendgrid:
    api-key: ${SENDGRID_API_KEY}
    from-email: ${SENDGRID_FROM_EMAIL}
    from-name: Kairos
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
