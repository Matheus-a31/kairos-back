spring:
  application:
    name: kairos
  
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/${POSTGRES_DB:kairos_db}
    username: ${POSTGRES_USER:kairos_user}
    password: ${POSTGRES_PASSWORD:kairos_password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

kairos:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-expiration: 900000
    refresh-expiration: 604800000
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
    from-email: ${SENDGRID_FROM_EMAIL:noreply@kairos.app}
    from-name: Kairos
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
